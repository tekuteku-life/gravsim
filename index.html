<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
	<title>gravsim</title>
	<link rel="stylesheet" href="style.css">
	<script src="gravsim.js" type="module"></script>
</head>
<body>
	<canvas id="gravsim-canvas"></canvas>

	<!-- Open/Close button for Smart Phone -->
	<button type="button" id="mobile-menu-toggle">☰ MENU</button>

	<!-- Control pannel (side-bar) -->
	<form id="ctrl-panel" class="sidebar">
		<!-- Tab navigation -->
		<div class="tabs">
			<button type="button" class="tab-btn active" data-target="tab-sys">System</button>
			<button type="button" class="tab-btn" data-target="tab-deploy">Deploy</button>
			<button type="button" class="tab-btn" data-target="tab-rocket">Rocket</button>
		</div>

		<!-- =====================================
			 TAB 1: System & View
		====================================== -->
		<div id="tab-sys" class="tab-content active">
			<div class="panel-section">
				<div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
					<button type="button" id="save-state-btn" style="width: 48%;">Save State</button>
					<button type="button" id="load-state-btn" style="width: 48%;">Load State</button>
					<input type="file" id="load-file-input" accept=".json" style="display: none;">
				</div>
			</div>

			<div class="panel-section">
				<label for="time-scale">Time scale:</label>
				<input type="range" id="time-scale" name="time-scale" value="-1" step="0.1" min="-6.5" max="1" class="slider-full">
				<div class="indicator"><span id="time-scale-indicator"></span></div>
				
				<label for="zoom-scale">Zoom level:</label>
				<input type="range" id="zoom-scale" name="zoom-scale" value="0" step="0.05" min="-2" max="6" class="slider-full">
				<div class="indicator"><span id="zoom-scale-indicator"></span></div>
				
				<label for="center-select">Center Object (Camera):</label>
				<select id="center-select" name="center" class="full-width"></select>
			</div>
		</div>

		<!-- =====================================
			 TAB 2: Easy Deploy
		====================================== -->
		<div id="tab-deploy" class="tab-content">
			<div class="panel-section">
				<label for="mass-select">Object Mass:</label>
				<select id="mass-select" name="mass" class="full-width"></select>
			</div>

			<div class="panel-section deploy-grid">
				<button type="button" id="put-neptune-btn">Neptune</button>
				<button type="button" id="put-uranus-btn">Uranus</button>
				<button type="button" id="put-saturn-btn">Saturn</button>
				<button type="button" id="put-jupiter-btn">Jupiter</button>
				<button type="button" id="put-mars-btn">Mars</button>
				<button type="button" id="put-earth-btn">Earth</button>
				<button type="button" id="put-venus-btn">Venus</button>
				<button type="button" id="put-mercury-btn">Mercury</button>
				<button type="button" id="put-moon-btn" style="grid-column: span 2;">Moon (around Earth)</button>
			</div>
		</div>

		<!-- =====================================
			 TAB 3: Rocket Launch
		====================================== -->
		<div id="tab-rocket" class="tab-content">
			<div class="panel-section">
				<label>Placement Mode:</label>
				<select id="rl-mode-select" class="full-width">
					<option value="free">Free (Click Canvas)</option>
					<option value="host" selected>Relative to Host</option>
				</select>
			</div>

			<div id="rl-host-options" class="panel-section">
				<label>Target Host:</label>
				<select id="rl-host-select" class="full-width"></select>

				<label>Host Angle (deg): <span id="rl-host-angle-val">0</span></label>
				<input type="range" id="rl-host-angle" min="0" max="360" value="0" class="slider-full">

				<label>Altitude (m): <span id="rl-host-alt-val">5</span></label>
				<input type="range" id="rl-host-alt" min="5" max="10000" step="1" value="5" class="slider-full">
			</div>

			<div class="panel-section launch-params">
				<label>Launch Angle (deg): <span id="rl-launch-angle-val">90</span></label>
				<input type="range" id="rl-launch-angle" min="0" max="360" value="90" class="slider-full">

				<label>Rocket Mass (t): <span id="rl-launch-mass-val">60</span></label>
				<input type="range" id="rl-launch-mass" min="5" max="5000" step="5" value="60" class="slider-full">

				<label>Thrust Force (kN): <span id="rl-launch-thrust-val">1000</span></label>
				<input type="range" id="rl-launch-thrust" min="600" max="10000" step="50" value="1000" class="slider-full">

				<label>Burn Time (s): <span id="rl-launch-burn-val">300</span></label>
				<input type="range" id="rl-launch-burn" min="1" max="1500" step="1" value="300" class="slider-full">

				<label>Payload Ratio (%): <span id="rl-launch-payload-val">20</span></label>
				<input type="range" id="rl-launch-payload" min="1" max="100" step="1" value="20" class="slider-full">
			</div>

			<div id="rl-stats-panel">
				Total Delta-v: <span id="rl-stat-dv">0.00</span> km/s<br>
				TWR (<span id="rl-stat-host-name">Earth</span>):<br>
				Y(Vert) <span id="rl-stat-twr-y">0.00</span> / X(Horz) <span id="rl-stat-twr-x">0.00</span>
			</div>
			
			<button type="button" id="rl-execute-btn" class="launch-btn">LAUNCH ROCKET</button>
		</div>
	</form>

	<div id="info-panel">
		<p>Elapsed time: <span id="elapsed-time">0.00</span> years</p>
		<p>Object count: <span id="object-count">0</span></p>
		<p>FPS: <span id="fps">0</span></p>
	</div>

	<button type="button" id="telemetry-toggle-btn">TELEMETRY: OFF</button>
	<div id="telemetry-panel" style="display: none;">
		<div class="telemetry-header">TELEMETRY DATA</div>
		<div class="telemetry-line">TARGET   : <select id="tm-target-select"></select></div>
		<div class="telemetry-line">REF BODY : <span id="tm-refbody">---</span></div>
		<div class="telemetry-line">ALTITUDE : <span id="tm-alt">---</span> km</div>
		<div class="telemetry-line">VELOCITY : <span id="tm-vel">---</span> km/s</div>
		<div class="telemetry-line">G-FORCE  : <span id="tm-gforce">---</span> G</div>
		<div class="telemetry-line">MASS     : <span id="tm-mass">---</span> t</div>

		<div id="tm-rocket-data" style="display: none;">
			<div class="telemetry-line">PROPELLANT:<span id="tm-prop">---</span> t</div>
			<div class="telemetry-line">BURN REM : <span id="tm-burn">---</span> s</div>
		</div>
	</div>
</body>
</html>
